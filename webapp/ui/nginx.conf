server {
    listen 80;
    listen [::]:80;

    server_name ${APP_DOMAIN} ${APP_DOMAIN_ALIASES};
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://${APP_DOMAIN}$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name ${APP_DOMAIN} ${APP_DOMAIN_ALIASES};
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-javascript
        application/xml
        font/eot
        font/otf
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # SSL certificates from Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/${APP_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_DOMAIN}/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    if ($host != ${APP_DOMAIN}) {
        return 301 https://${APP_DOMAIN}$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Docker container IPs can change after a service is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Serve Angular app. The app shell may be cached, but must be revalidated
    # because it points to the current hashed JS/CSS bundles after every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    # Static SEO landing page. Exact match wins over the `location /` SPA
    # fallback below, so this URL is served as real HTML instead of the app shell.
    location = /crypto-lottery-solana {
        add_header Cache-Control "no-cache" always;
        default_type text/html;
        try_files /crypto-lottery-solana.html =404;
    }

    # Settings that differ between deployments. The app reads this file before
    # the first screen (`initEnv` in shared.module.ts) and overrides the built-in
    # values with it. The file did not exist at all before: the request answered
    # 404 and the devnet stand lived with mainnet Solscan links.
    location = /environment.json {
        add_header Cache-Control "no-cache" always;
        default_type application/json;
        return 200 '{"solanaExplorerQuery":"${SOLANA_EXPLORER_QUERY}","verifyDocsUrl":"${VERIFY_DOCS_URL}"}';
    }

    location = /site.webmanifest {
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files /site.webmanifest =404;
    }

    location ~* "^/.+[.-][0-9a-f]{8,}\.(js|css|mjs)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(js|css|mjs|map|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|json|xml|txt)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # Authenticated Helius events are durably queued by the standalone launch scout.
    location = /hooks/helius/pump {
        client_max_body_size 10m;
        set                     $launch_scout_webhook http://launch-scout-webhook:8789;
        proxy_pass              $launch_scout_webhook/helius;
        proxy_http_version      1.1;
        proxy_set_header        Host $host;
        proxy_set_header        Authorization $http_authorization;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_connect_timeout   1s;
        proxy_send_timeout      2s;
        proxy_read_timeout      2s;
    }

    # WebSocket endpoint for authenticated real-time chat.
    location ^~ /api/ws/ {
        set                $backend http://lottery-api:8000;
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy API requests to backend
    location ^~ /api/ {
        client_max_body_size 6m;
        set                $backend http://lottery-api:8000;
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
